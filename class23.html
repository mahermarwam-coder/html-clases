    <h2>Javascript array methods</h2>
<h2>join() and pop()</h2>
<p>The join() method converts an array into a string. and The pop() method removes the last element from an array.</p>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<p id="mya"></p>

<script>

var fruits = ["Banana", "Orange", "Apple", "Mango"];
document.getElementById("myjoin").innerHTML = fruits.join(" 67 ");
document.getElementById("myfirstpop").innerHTML = fruits;
fruits.pop();
document.getElementById("mysecondpop").innerHTML = fruits

fruits.pop();
document.getElementById("mya").innerHTML = fruits;
</script>
