<!DOCTYPE html>
<html>

<head>
    <title>My Favorite Person</title>



    <style>
        body {
            background-color: #F0F0F2;
            background-image: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)), url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #FF5A43;
            font-size: 36px;
            text-shadow: 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,0.15);
        }

        .card-body {
            font-size: 18px;
            color: #444;
            text-transform: none;
            margin: 6px 0;
            text-shadow: 0 1px 0 #fff;
        }

        .card-title {
            font-size: 22px;
            color: #222;
            font-weight: bold;
        }
        .card-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: #fff;
            padding: 18px;
            max-width: 420px;
            border-radius: 8px;
            outline: 3px solid rgba(255,90,67,0.12);
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 14px 30px rgba(0,0,0,0.18);
        }
    </style>

</head>


<body>


    <div class="card">
        <h1>Profile</h1>
        <div class="card-title">Name: Maher Sherfawi</div>
        <div class="card-body">Age: 44</div>
        <div class="card-body">Work: 
Senior Retail Store Manager at Chalhoub Group</div>
        <div class="card-body">Born: 1982</div>
        <a class="card-link" href="https://www.linkedin.com/search/results/people/?origin=SEO_PSERP&firstName=%22Maher%22&lastName=%22Sherfawi%22" target="_blank" rel="noopener noreferrer">Click here to view their LinkedIn profile</a>
    </div>









</body>









</html>
