<!DOCTYPE html>
<html>


<head>
<title>JavaScript Objects and Math</title>


</head>



<body>

    <h2>JavaScript Objects and its Properties </h2>

    <p>There are two different ways to access object properties in JavaScript</p>

    <p>you can use.property or ["property"]</p>
    <p id="demo"></p>
    <script>
    // Create an object:
    var person = {firstName : "Adam",
    age: 12
    }
    document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old.";
    </script>

    <hr>

    <h2>Built-Math Objects in JS</h2>

    <script>
    var a=Math.sqrt(49);
    document.write("The square root of 49 is: " + a);

    var b=Math.floor(7.8);
    document.write("<br>The floor value of 7.8 is: " + b);

    var c=Math.ceil(7.8);
    document.write("<br>The ceiling value of 7.8 is: " + c);

    var d=Math.random();
    document.write("<br>A random number between 0 and 1 is: " + d);

    var e=Math.floor(Math.random() * 10) + 1;
    document.write("<br>A random number between 1 and 10 is: " + e);
    </script>

<hr>




</body>



</html>
