<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            right: 30px;
            border: 3px solid crimson;

        }

        div.absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;

        }

        div.relative {
            position: relative;
            left: 100px;
            border: 3px solid yellowgreen;

        }

        div.fixed {
            position: fixed;
            top: 0;
            right: 20px;
            width: 300px;
            border: 3px solid goldenrod;
        }

        div.sticky {
            position: sticky;
            top: 1px;
            left: 20px;
            width: 100px;
            border: 3px solid orangered;

        }
    </style>

</head>


<body>
    <h2>POSITIONING</h2>
    <div>
        Div with no position property

    </div>

    <div class="Sticky">
        div with sticky position property
    </div>

    <div class="relative">
        this div element has position: relative;

        <div class="absolute "> Absolute class DIV </div>

    </div>
    <div class="fixed "> div with fixed position property </div>
