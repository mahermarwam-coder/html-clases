<!doctype html>
<html lang="en">

<head>
    <title>Zoo Rescue Tracker</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        .zoo-hero {
            height: 100vh;
            background-image: url("https://images.pexels.com/photos/158471/pexels-photo-158471.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
        }

        .zoo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .zoo-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- HERO SECTION (FIXED) -->
<div class="zoo-hero">

    <div class="zoo-overlay"></div>

    <div class="zoo-content">
        <h1 class="display-3">Zoo Rescue Tracker</h1>
        <h3>Saving Animals. Protecting Futures.</h3>
    </div>

</div>

<!-- CONTENT -->
<div class="container mt-5">

    <p>
        Welcome to Wildlife Rescue Zoo... (your text stays here)
    </p>

    <hr>

    <!-- IMAGE GRID FIXED -->
    <div class="row">

        <div class="col-6 col-md-3 mb-3">
            <img src="https://images.pexels.com/photos/145939/pexels-photo-145939.jpeg"
                 class="img-fluid" style="height:120px; object-fit:cover;">
        </div>

        <div class="col-6 col-md-3 mb-3">
            <img src="https://images.pexels.com/photos/33045/lion-wild-africa-african.jpg"
                 class="img-fluid" style="height:120px; object-fit:cover;">
        </div>

        <div class="col-6 col-md-3 mb-3">
            <img src="https://images.pexels.com/photos/6235110/pexels-photo-6235110.jpeg"
                 class="img-fluid" style="height:120px; object-fit:cover;">
        </div>

    </div>

    <footer class="text-center mt-4">
        Contact us: Zoorescusers@gmail.com
    </footer>

</div>

</body>
</html>
