<!DOCTYPE html>
<html>

<head>
    <title>My Superhero Power Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff4d4d;
        }

        p {
            color: #444444;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid #ff4d4d;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .hero-power {
            color: #0057b8;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1> My Super Hero cards</h1>
    <p>
        click the button to create objects using JS classes!!

    </p>


    <button onclick="showHeroes()">
        Superheroes
    </button>

    <div class="card-container" id="heroCards">

    </div>


    <script>
     
    // what is a class?
    // A class is a blueprint used to creaet objects.

    class Superhero {
        

        constructor(name,power,mission){
            this.name = name;
            this.power = power;
            this.mission = mission;
        }
        describeHero() {
            return `${this.name} has the power of ${this.power} and their mission is ${this.mission}.`;
        }
        

    }

    function showHeroes() {
        const hero1 = new Superhero("Superman", "Flight and Super Strength", "Protect the world from evil.");
        const hero2 = new Superhero("Wonder Woman", "Superhuman strength and combat skills", "Fight for justice and peace.");
        const hero3 = new Superhero("Spider-Man", "Wall-crawling and web-slinging", "Protect the city and help people.");

        const heroes = [hero1, hero2, hero3];
        const heroCards = document.getElementById("heroCards");

        heroCards.innerHTML = heroes.map(hero => `
            <div class="hero-card">
                <div class="hero-name">${hero.name}</div>
                <p class="hero-power">${hero.power}</p>
                <p class="hero-mission">${hero.mission}</p>
                <p>${hero.describeHero()}</p>
            </div>
        `).join("");
    }

    </script>



</body>

</html>
