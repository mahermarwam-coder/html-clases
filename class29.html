<!DOCTYPE html>

<html>


<head>

    <style>
        body {

            font-family: Arial, sans-serif;

            background: aliceblue;

            text-align: center;

            padding: 30px;

        }

        h1 {
            color: #ff5a43;
        }

        button {

            background: #ff5a43;

            color: white;

            padding: 10px 25px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            margin: 5px;

        }

        div {

            border: 1px solid #ff5a43;

            width: 280px;

            margin: 6px auto;

            padding: 8px 12px;

            text-align: left;

            border-radius: 6px;

        }
    </style>


</head>


<body>
    <h1>My Delivery Tracker</h1>
    <button onclick="saveOrder()">Save Order</button>
    <button onclick="startDelivery()">Start Delivery</button>


    <div>JSON Text: <span id="json-text"></span></div>
    <div>Loaded Item: <span id="loaded-item"></span></div>
    <div>Loaded Price: <span id="loaded-price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>


    <script>

        let order = {
            item: "Pizza",
            price: 15,
            shop: "Pizza Palace"
        };

        function saveOrder() {
            let jsonText = JSON.stringify(order);
            let loadedOrder = JSON.parse(jsonText);

            document.getElementById("json-text").textContent = jsonText;
            document.getElementById("loaded-item").textContent = loadedOrder.item;
            document.getElementById("loaded-price").textContent = "$" + loadedOrder.price.toFixed(2);
            document.getElementById("status").textContent = "Order saved";
            document.getElementById("result").textContent = "";
        }

        function delay(ms) {
            return new Promise(function (resolve) {
                setTimeout(resolve, ms);
            });
        }

        async function startDelivery() {
            const statusEl = document.getElementById("status");
            const resultEl = document.getElementById("result");

            statusEl.textContent = "Kitchen is preparing...";
            resultEl.textContent = "";

            await delay(5000);
            statusEl.textContent = "Order is out for delivery...";

            await delay(5000);
            statusEl.textContent = "Order has been delivered!";
            resultEl.textContent = "Enjoy your meal!";
        }

        saveOrder();
    </script>



</body>









</html>
